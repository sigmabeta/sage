// Stability rules for SAGE-defined types.
// Read by sage-build-logic's AndroidCompose convention plugin in two contexts:
//   1. SAGE's own build (compiling sage/android/* Compose modules).
//   2. Consumer builds that includeBuild("sage") (chipbox, vgls-android, ...);
//      the plugin auto-detects "sage" via gradle.includedBuilds and feeds this
//      file to the consumer's compose-compiler alongside the consumer's own
//      compose-stability.conf.
//
// Entries are FQNs; `*` matches one segment, `**` matches subpackages.

// Action hierarchy: the open-class root. Concrete subtypes are data class /
// data object holding only stable fields.
net.sigmabeta.sage.appcomm.SageAction

// Action sink: a fun interface. Implementations (ViewModels) have stable
// identity across recompositions.
net.sigmabeta.sage.appcomm.ActionSink

// List item models: data classes that infer as unstable transitively
// (open-class fields, Throwable, etc.). Wildcarding the package also covers
// any new *ListModel added later.
net.sigmabeta.sage.components.*

// Rendered list state — what ListScreen / GridScreen collect each frame.
net.sigmabeta.sage.list.ListStateActual

// String resolver passed into ListState.toActual.
net.sigmabeta.sage.ui.StringProvider

// Image-source wrapper used by ImageNameListItem / CrossfadeImage.
net.sigmabeta.sage.images.SourceInfo

// stdlib types that appear in stable data classes (notably LCE.Error.error).
// Marking Throwable stable cascades: LCE.Error -> LCE<T> -> screen states
// holding an LCE field become stable, unlocking skip on the list container.
kotlin.Throwable
