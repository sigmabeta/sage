# Compose Multiplatform — desktop runtime + window/Skia bits. 1.9.0 is the latest stable
# at the time of writing; newer lines (1.10/1.11) ship the Gradle plugin but the lib jars
# (material3, foundation, etc.) only go up to 1.9.0 stable. Bump when both sides advance.
# JetBrains CMP tolerates newer Kotlin than it bundles (the @Composable codegen lives in
# the Kotlin `compose-compiler` plugin, not in CMP itself).
composeMultiplatform = "1.9.0"
detekt = "1.23.8"
firebaseBom = "34.13.0"
firebaseCrashlyticsPlugin = "3.0.7"
firebasePerfPlugin = "2.0.2"
gitVersion = "1.6.0"
gradlePublisher = "4.0.0"
gmsPlugin = "4.4.4"
hilt = "2.59.2"
hilt-work = "1.3.0"
jankStatsVersion = "1.0.0-beta01"
junit4 = "4.13.2"
kotlin = "2.3.10"
kotlinxCollections = "0.4.0"
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.7.3"
ksp = "2.3.7"
# licensePlugin = "0.9.8" # No support for AGP 9 yet
material = "1.13.0"
mavericks = "3.1.0"
media3 = "1.10.0"
moshi = "1.15.2"
okhttp = "5.3.2"
paparazzi = "2.0.0-alpha04"
retrofit = "3.0.0"
room = "2.8.4"
# Bundled SQLite driver for Room KMP (Android + JVM/desktop + native). Paired
# with Room 2.8.x.
sqliteBundled = "2.6.0"
splash = "1.2.0"
supportSqlite = "3.49.0"
threeten = "1.4.9"
tracing = "1.11.1"
webview = "0.33.6"
zoomable = "0.19.0"

