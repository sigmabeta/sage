# Compose Multiplatform lib jars (runtime / foundation / material3 / ui / components-resources).
# 1.9.0 is the latest stable on Maven Central; the newer Gradle plugin (`composeMultiplatformPlugin`
# below) is at 1.11.0 because the 1.9.0 plugin breaks against AGP 9 KMP. The plugin manages its
# own internal compose lib version, so the version skew between this and `composeMultiplatformPlugin`
# is intentional — bump both when stable lib jars catch up to the plugin line.
composeMultiplatform = "1.9.0"
# JetBrains Compose Gradle plugin — pinned a line ahead of `composeMultiplatform` above. The
# 1.9.0 plugin breaks against AGP 9's `KotlinMultiplatformAndroidComponentsExtension.onVariant`
# (NoSuchMethodError when applied to a `sage.kmp` module); 1.11.0 fixes the variant call. The
# plugin manages its own internal Compose-lib version, so coexisting with the libs at 1.9.0 is
# safe. Bump both when stable lib jars catch up to the plugin line.
composeMultiplatformPlugin = "1.9.3"
detekt = "1.23.8"
ktlintGradle = "14.2.0"
# Pins the ktlint engine used by the Gradle plugin to the version the old ktlint-check.sh
# downloaded, so switching to Gradle doesn't change the active ruleset.
ktlintTool = "1.8.0"
firebaseBom = "34.13.0"
firebaseCrashlyticsPlugin = "3.0.7"
firebasePerfPlugin = "2.0.2"
gitVersion = "1.6.0"
gradlePublisher = "4.0.0"
gmsPlugin = "4.4.4"
hilt = "2.59.2"
hilt-work = "1.3.0"
jankStatsVersion = "1.0.0-beta01"
junit4 = "4.13.2"
kotlin = "2.3.21"
kotlinxCollections = "0.4.0"
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.11.0"
# Ktor — HTTP server (apps/server) + JS client (apps/js → server). 3.x is built for K2 and works
# on Kotlin 2.3.21. Server uses ktor-server-netty + content-negotiation + partial-content (Range)
# + status-pages + cors + call-logging; client uses ktor-client-js + content-negotiation.
ktor = "3.5.0"
# Logback — SLF4J backend Ktor uses for its own logging. Classic, not slim, since this is a
# server deployment where one extra MB doesn't matter for one extra dep.
logback = "1.5.33"
# Kover — JVM/Android unit-test coverage. 0.9.2 was the first release with AGP 9 KMP-library
# support; 0.9.4/0.9.5 finished it. Applied via chipbox's root build.gradle.kts only.
kover = "0.9.8"
ksp = "2.3.7"
# licensePlugin = "0.9.8" # No support for AGP 9 yet
material = "1.13.0"
mavericks = "3.1.0"
media3 = "1.10.1"
metro = "1.1.1"
# Mordant — terminal styling + interactive widgets (the arrow-key select list) for the JVM CLI
# app (:apps:cli). The plain `mordant` artifact resolves to `mordant-jvm`, which pulls all three
# JVM terminal backends (JNA / FFM / GraalVM); JNA is the one that works on the Java 17 toolchain
# (FFM needs JDK 22+), and Mordant auto-selects it at runtime.
mordant = "3.0.2"
moshi = "1.15.2"
okhttp = "5.3.2"
okio = "3.17.0"
paparazzi = "2.0.0-alpha05"
retrofit = "3.0.0"
room = "2.8.4"
# Bundled SQLite driver for Room KMP (Android + JVM/desktop + native). Paired
# with Room 2.8.x.
sqliteBundled = "2.6.2"
splash = "1.2.0"
supportSqlite = "3.49.0"
threeten = "1.4.9"
# Voyager — Compose Multiplatform navigation library. Picked over
# `androidx.navigation:navigation-compose` because the AndroidX CMP fork (2.9.8) publishes
# JVM variants but `jvmStubsRuntimeElements-published` has zero files — compile-time stubs
# only, no runnable desktop implementation. Pinned to a 1.1.0 beta rather than 1.0.1 stable
# because 1.0.1's `AndroidScreenLifecycleOwner` throws
# `State is 'DESTROYED' and cannot be moved to 'STARTED'` on pop+recompose against
# androidx.lifecycle 2.10.x (e.g. ArtistDetail → back → GameDetail recomposes). Fixed in
# the 1.1.0 line; bump to 1.1.0 stable when it lands.
voyager = "1.1.0-beta03"
tracing = "1.11.2"
webview = "0.33.6"
zoomable = "0.19.0"

