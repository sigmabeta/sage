# Dependencies of the included build-logic
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "androidGradlePlugin" }
detekt-gradlePlugin = { group = "io.gitlab.arturbosch.detekt", name = "detekt-gradle-plugin", version.ref = "detekt" }
firebase-crashlytics-gradlePlugin = { group = "com.google.firebase", name = "firebase-crashlytics-gradle", version.ref = "firebaseCrashlyticsPlugin" }
firebase-performance-gradlePlugin = { group = "com.google.firebase", name = "perf-plugin", version.ref = "firebasePerfPlugin" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-compose-compiler-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-gradlePlugin = { group = "org.jetbrains.kotlin.plugin.serialization", name = "org.jetbrains.kotlin.plugin.serialization.gradle.plugin", version.ref = "kotlin" }

# Metro DI extensions — the core runtime is auto-added by the dev.zacsweers.metro Gradle
# plugin; metrox-viewmodel + metrox-viewmodel-compose are the @HiltViewModel / hiltViewModel()
# replacement (see docs/metro-migration.md).
metrox-viewmodel = { group = "dev.zacsweers.metro", name = "metrox-viewmodel", version.ref = "metro" }
metrox-viewmodel-compose = { group = "dev.zacsweers.metro", name = "metrox-viewmodel-compose", version.ref = "metro" }
# Used by sage-build-logic: SageDiModulePlugin applies the Metro plugin and SageFeatureRealPlugin
# configures MetroPluginExtension (the KT-82395 hint-codegen gate) — both need it on the classpath.
metro-gradlePlugin = { group = "dev.zacsweers.metro", name = "gradle-plugin", version.ref = "metro" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
android-test = { id = "com.android.test", version.ref = "androidGradlePlugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatformPlugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsPlugin" }
firebase-perf = { id = "com.google.firebase.firebase-perf", version.ref = "firebasePerfPlugin" }
git-version = { id = "io.github.reactivecircus.app-versioning", version.ref = "gitVersion" }
gradle-publisher = { id = "com.github.triplet.play", version.ref = "gradlePublisher" }
gms = { id = "com.google.gms.google-services", version.ref = "gmsPlugin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }
# licenses = { id = "com.jaredsburrows.license", version.ref = "licensePlugin" }  # No support for AGP 9 yet
paparazzi = { id = "app.cash.paparazzi", version.ref = "paparazzi" }

# SAGE convention plugins
sage-android = { id = "sage.android" }
sage-jvm = { id = "sage.jvm" }
sage-kmp = { id = "sage.kmp" }
sage-kmp-js = { id = "sage.kmp.js" }
sage-compose-android = { id = "sage.compose.android" }
sage-compose-kmp = { id = "sage.compose.kmp" }
sage-di = { id = "sage.di" }
sage-di-worker-android = { id = "sage.di.worker.android" }

# VGLS plugin aliases — app/feature plugins stay in VGLS build-logic
vgls-android-app = { id = "vgleadsheets.android.app", version = "1.0" }
vgls-compose-android-app = { id = "vgleadsheets.compose.android.app", version = "1.0" }
vgls-feature-android = { id = "vgleadsheets.feature.android", version = "1.0" }
vgls-feature-compose-android = { id = "vgleadsheets.feature.compose.android", version = "1.0" }
