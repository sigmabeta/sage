hilt-core = { group = "com.google.dagger", name = "hilt-core", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
# Plain Dagger (Hilt's underlying engine). Dagger and Hilt always ship the same
# version. Used by the headless JVM app, which assembles its own @Component
# rather than running Hilt — Hilt is Android-only by design.
dagger = { group = "com.google.dagger", name = "dagger", version.ref = "hilt" }
dagger-compiler = { group = "com.google.dagger", name = "dagger-compiler", version.ref = "hilt" }
hilt-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }

# JetBrains Compose Multiplatform — platform-agnostic UI libs that build for both Android
# (alongside androidx-compose-*) and JVM/desktop. The per-OS Skia native artifact is pulled
# via `compose.desktop.currentOs` from the JetBrains Compose Gradle plugin extension (only
# applied in apps/jvm, not in the sage.compose.kmp convention).
jetbrains-compose-runtime    = { module = "org.jetbrains.compose.runtime:runtime",       version.ref = "composeMultiplatform" }
jetbrains-compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
jetbrains-compose-material3  = { module = "org.jetbrains.compose.material3:material3",   version.ref = "composeMultiplatform" }
jetbrains-compose-ui         = { module = "org.jetbrains.compose.ui:ui",                 version.ref = "composeMultiplatform" }

junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }
kotlinx-collections-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "kotlinxCollections" }
