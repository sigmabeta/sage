org.gradle.jvmargs=-Xmx3072m -XX:+UseParallelGC
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
# sage.kmp wires jvmSharedMain explicitly; the Default Kotlin Hierarchy Template
# refuses to apply once custom dependsOn edges are added and warns per module.
kotlin.mpp.applyDefaultHierarchyTemplate=false
org.gradle.unsafe.configuration-cache=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
# AGP 9's built-in Kotlin disallows generated source sets contributing via
# kotlin.sourceSets DSL (KSP currently does this). Allow the legacy behaviour
# until KSP migrates to android.sourceSets.
android.disallowKotlinSourceSets=false
